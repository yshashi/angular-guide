<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="45%" stop-color="#E040FB"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <rect width="32" height="32" rx="7.5" fill="url(#g)"/>
  <rect width="32" height="32" rx="7.5" fill="url(#shine)"/>

  <!-- Angular shield (subtle watermark) -->
  <path d="M16 3.5 L27 9 L25.2 24 L16 29 L6.8 24 L5 9Z"
        fill="none" stroke="#fff" stroke-width="0.6" opacity="0.1"/>

  <!-- Code brackets < /> -->
  <path d="M12.5 11 L7.5 16 L12.5 21"
        fill="none" stroke="#fff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19.5 11 L24.5 16 L19.5 21"
        fill="none" stroke="#fff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 9.5 L14 22.5"
        fill="none" stroke="#fff" stroke-width="1.6"
        stroke-linecap="round" opacity="0.55"/>
</svg>
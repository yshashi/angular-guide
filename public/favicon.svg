<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Blue gradient for background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2"/>
      <stop offset="50%" style="stop-color:#357ABD"/>
      <stop offset="100%" style="stop-color:#2E5F8A"/>
    </linearGradient>
    
    <!-- Orange gradient for accents -->
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C42"/>
      <stop offset="100%" style="stop-color:#E67E22"/>
    </linearGradient>
    
    <!-- Card gradient -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>
  
  <!-- Angular Shield -->
  <path d="M16 4L24 9V19L16 24L8 19V9L16 4Z" fill="rgba(255,255,255,0.2)" stroke="url(#orange)" stroke-width="1"/>
  
  <!-- NG Text -->
  <text x="16" y="14" font-family="Arial,sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="#fff">NG</text>
  
  <!-- Guide Card -->
  <!-- Card shadow -->
  <rect x="11.5" y="16.5" width="9" height="6" rx="1" fill="rgba(0,0,0,0.15)"/>
  
  <!-- Card base -->
  <rect x="11" y="16" width="9" height="6" rx="1" fill="url(#cardGradient)" stroke="rgba(255,255,255,0.4)" stroke-width="0.3"/>
  
  <!-- Card header -->
  <rect x="11" y="16" width="9" height="1.5" rx="1" fill="url(#orange)" opacity="0.9"/>
  <rect x="11" y="17.3" width="9" height="0.2" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Card content lines -->
  <line x1="12" y1="18.5" x2="19" y2="18.5" stroke="#4A90E2" stroke-width="0.3" opacity="0.6"/>
  <line x1="12" y1="19.2" x2="17.5" y2="19.2" stroke="#4A90E2" stroke-width="0.3" opacity="0.6"/>
  <line x1="12" y1="19.9" x2="18.5" y2="19.9" stroke="#4A90E2" stroke-width="0.3" opacity="0.6"/>
  <line x1="12" y1="20.6" x2="16.5" y2="20.6" stroke="#4A90E2" stroke-width="0.3" opacity="0.6"/>
  
  <!-- Card icon/badge -->
  <circle cx="18.5" cy="17.8" r="0.8" fill="rgba(255,255,255,0.9)" stroke="url(#orange)" stroke-width="0.2"/>
  <text x="18.5" y="18" font-family="Arial,sans-serif" font-size="0.8" font-weight="bold" text-anchor="middle" fill="#FF8C42">G</text>
  
  <style>
    @media (prefers-color-scheme: dark) {
      circle { fill: url(#bg); }
    }
  </style>
</svg>
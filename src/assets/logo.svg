<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="45%" stop-color="#E040FB"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>
  <rect width="40" height="40" rx="10" fill="url(#shine)"/>

  <!-- Angular shield watermark -->
  <path d="M20 4 L34 11 L31.8 30 L20 36.5 L8.2 30 L6 11Z"
        fill="none" stroke="#fff" stroke-width="0.5" opacity="0.08"/>

  <!-- Code brackets </> with subtle glow -->
  <g filter="url(#glow)">
    <path d="M16 13 L9 20 L16 27"
          fill="none" stroke="#fff" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 13 L31 20 L24 27"
          fill="none" stroke="#fff" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22.5 11 L17.5 29"
          fill="none" stroke="#fff" stroke-width="1.8"
          stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    # Refresh the API address after a container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8787;

    # Resolve the client through trusted private reverse proxies, not arbitrary public headers.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";

    location = /api/ask {
        proxy_pass http://$api_backend/ask$is_args$args;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header X-Accel-Buffering no always;
    }

    location = /health {
        proxy_pass http://$api_backend/health$is_args$args;
        proxy_cache off;
        add_header Cache-Control no-store always;
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.(md|txt)$ {
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control no-cache;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-cache;
    }

    error_page 404 /404.html;
}
